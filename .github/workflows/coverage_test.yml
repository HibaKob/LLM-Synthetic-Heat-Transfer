name: coverage_test

# reference:
# https://github.com/pybind/python_example/blob/master/.github/workflows/pip.yml

# on: [push]
on:
  push:
    paths:
      - '**.py'
      - '**.yml'

jobs:
  build:
    strategy:
      max-parallel: 2
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Install package
      run: |
        python -m pip install -e .
    - name: Test with pytest and generate coverage report
      run: |
        pytest -v --cov=syntheticheatransfer --cov-report=xml --disable-warnings
    - name: Upload coverage to Codecov
      # https://github.com/codecov/codecov-action/blob/master/README.md
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
        files: ./coverage.xml
        flags: unittests # optional
        name: codecov-umbrella # optional
        fail_ci_if_error: false # optional (default = false)
        verbose: true # optional (default = false)
